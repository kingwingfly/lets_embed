name = "lets-embed-admin-dashboard-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"
# Public *.workers.dev and preview URLs MUST stay disabled; reachable ONLY via
# gateway_worker's privileged `ADMIN_DASHBOARD_WORKER` service binding (`gallery_admin = true`).
workers_dev = false
preview_urls = false

[build]
command = "./build-web.sh && cargo install -q \"worker-build@^0.9\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

# Mandatory: run_worker_first = true ensures static /admin HTML/JS/WASM assets NEVER
# serve before the Worker verifies `X-Gallery-Admin-Assertion` (`aa2.`) + `x-gallery-admin-email`.
# html_handling = "none" prevents Cloudflare Assets from issuing 307 redirects on `/index.html`.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
# Optional dedicated admin hostname (split-host deployments). When set, ONLY
# `https://{ADMIN_DOMAIN}` is trusted as a CSRF Origin for `/admin/api/*` mutations.
# ADMIN_DOMAIN = "admin.lets-embed.louisfly.icu"
# Public hostname fallback for same-origin CSRF verification when ADMIN_DOMAIN is unset.
SIWE_DOMAIN = "lets-embed.louisfly.icu"
# Canonical public origin (optional; takes precedence over SIWE_DOMAIN when set).
PUBLIC_URL = "https://lets-embed.louisfly.icu"
# Deployment identifier bound into AES-256-GCM AAD for `provider_secrets`.
DEPLOYMENT_ID = "lets-embed-prod"
# Optional origin URL for publish-time catalog validation (`POST {APP_ORIGIN}/internal/validate-safety-catalog`)
# of `post_tag:` and `author:` predicates. Can also be provided as a service binding named `APP_ORIGIN`.
# APP_ORIGIN = "https://origin.lets-embed.louisfly.icu"

# Worker secrets (configured via `wrangler secret put`):
#
# RECOMMENDED SINGLE SECRET:
#   SITE_SECRET                  — High-entropy (>= 32 bytes) master secret shared across
#                                  gateway_worker, user_worker, admin_dashboard_worker, and
#                                  lets-embed-web. RFC 5869 HKDF-SHA256 automatically derives
#                                  cryptographically isolated keys for:
#                                    - KeyDomain::AdminAssertion   (`aa2.` verification)
#                                    - KeyDomain::InternalApi      (`/internal/validate-safety-catalog`)
#                                    - KeyDomain::ProviderSecrets  (32-byte AES-256-GCM key)
#
# OPTIONAL PER-DOMAIN OVERRIDES (take precedence over `SITE_SECRET` for independent rotation):
#   ADMIN_ASSERTION_SECRET       — explicit override for `X-Gallery-Admin-Assertion` (`aa2.`) HMAC verification.
#   INTERNAL_API_SECRET          — explicit override for origin `/internal/*` calls.
#   PROVIDER_SECRETS_KEY         — optional explicit 32-byte base64/hex AES-256-GCM key override for `provider_secrets`.
#   PROVIDER_SECRETS_KEY_PREV    — optional previous 32-byte key during zero-downtime secret rotation (or `SITE_SECRET_PREV`).
#   CF_ACCESS_CLIENT_ID          — optional Cloudflare Access service token ID for `APP_ORIGIN`.
#   CF_ACCESS_CLIENT_SECRET      — optional Cloudflare Access service token secret for `APP_ORIGIN`.
[secrets]
required = ["SITE_SECRET"]

[[d1_databases]]
binding = "DB"
database_name = "lets-embed"
database_id = "ee6985fc-ed13-414f-8f85-8727c86f3b48"

[durable_objects]
bindings = [
  { name = "USER_ACCOUNT", class_name = "UserAccount", script_name = "lets-embed-user-worker" },
  { name = "SITE_POLICY", class_name = "SitePolicyDO", script_name = "lets-embed-user-worker" },
]
