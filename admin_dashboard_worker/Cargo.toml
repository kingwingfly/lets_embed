[workspace]
exclude = ["web"]

[package]
name = "admin_dashboard_worker"
version = "0.1.0"
edition = "2024"
authors = ["Louis <836250617@qq.com>"]
license = "MIT"
repository = "https://github.com/kingwingfly/lets_embed"
documentation = "https://github.com/kingwingfly/lets_embed"

[lib]
# rlib in addition to cdylib so `cargo test --manifest-path admin_dashboard_worker/Cargo.toml` runs host unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
site_access = { path = "../site_access" }
search_types = { path = "../search_types", features = ["serde"] }
worker = { version = "0.9", features = ["http", "axum", "d1"] }
axum = { version = "0.8", default-features = false, features = ["macros", "json", "query"] }
tower-service = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
bs58 = "0.5"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
