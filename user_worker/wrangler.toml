name = "user-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Public hostname the SIWE message must be signed for (the gateway-worker's domain).
SIWE_DOMAIN = "lets-embed.louisfly.icu"
# Ethereum JSON-RPC endpoint used to verify ETH/ERC-20 top-ups + Chainlink prices.
RPC_URL = "https://cloudflare-eth.com"
# Deposit address users send ETH/ERC-20 to (MUST be lowercase). Placeholder — set before deploy.
DEPOSIT_ADDRESS = "0xe441B924145Ee4eE855D7Bd81BE58C8F4d9a7056"
CHAIN_ID = "1"
# Solana JSON-RPC endpoint used to verify SOL / SPL top-ups.
SOL_RPC_URL = "https://api.mainnet-beta.solana.com"
# Deposit address users send SOL / SPL tokens to (base58). Placeholder — set before deploy.
SOL_DEPOSIT_ADDRESS = "GjgLaySkPhke5xrgu67uxxmcVoaBwNyjp3LTsZyu79Tx"
# Cloudflare Access application protecting /user/admin* (new Access app — set its AUD).
CF_ACCESS_TEAM_DOMAIN = "kingwingfly.cloudflareaccess.com"
CF_ACCESS_AUD = "5700459f509f888154922a3f93bbf18d7dbd6b4be7fa472716693eb2fefb6ba5"

[[secrets_store_secrets]]
binding = "lets-embed-jwt-secret"
store_id = "93d561f5fef7447eb3e1fd77e6445903"
secret_name = "lets-embed-jwt-secret"

# SIWE nonces, single-use, TTL-expired. Create the namespace and fill in the id:
#   wrangler kv namespace create NONCES
[[kv_namespaces]]
binding = "NONCES"
id = "1d3aa70037834252a25d895d60637774"

# Reuses the gateway's JWKS cache namespace (CF Access RS256 verification for /user/admin).
[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "95b240d71a024088ae4c2c36422e1372"

[[d1_databases]]
binding = "DB"
database_name = "lets-embed"
database_id = "ee6985fc-ed13-414f-8f85-8727c86f3b48"

[durable_objects]
bindings = [{ name = "USER_ACCOUNT", class_name = "UserAccount" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserAccount"]
