name = "lets-embed-user-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --profile wasm-release"

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Public hostname the SIWE/SIWS messages and same-origin CSRF checks bind to.
SIWE_DOMAIN = "lets-embed.louisfly.icu"
# Pinned canonical origin used for OAuth/OIDC callbacks and email login links (L2).
PUBLIC_URL = "https://lets-embed.louisfly.icu"
# Deployment identifier bound into AES-256-GCM AAD for `provider_secrets` (M3).
DEPLOYMENT_ID = "lets-embed-prod"
# Ethereum JSON-RPC endpoint used to verify ETH/ERC-20 top-ups + Chainlink prices.
RPC_URL = "https://cloudflare-eth.com"
CHAIN_ID = "1"
# Solana JSON-RPC endpoint used to verify SOL / SPL top-ups.
SOL_RPC_URL = "https://api.mainnet-beta.solana.com"

# Worker secrets; deploy fails until required secrets are set with `wrangler secret put <NAME>`:
#   JWT_SECRET                  — HS256 legacy session secret (shared with gateway_worker during cutover)
#   SETTINGS_ENCRYPTION_KEY     — Dedicated 32-byte AES-256-GCM key (base64 or 64-char hex, optional "<kid>:" prefix)
#                                 for decrypting `provider_secrets`; NEVER derived from JWT_SECRET (M3).
# Optional secrets:
#   SESSION_V2_SECRET           — Dedicated key for revocable `v2.` sessions (falls back to domain-separated JWT_SECRET)
#   SETTINGS_ENCRYPTION_KEY_PREV — Previous 32-byte AES-256-GCM key during zero-downtime key rotation
#   GOOGLE_CLIENT_SECRET / GITHUB_CLIENT_SECRET / X_CLIENT_SECRET / DISCORD_CLIENT_SECRET /
#   OIDC_AGE_CLIENT_SECRET / TELEGRAM_BOT_TOKEN / EMAIL_API_KEY — optional env fallbacks if not stored in D1
[secrets]
required = ["JWT_SECRET", "SETTINGS_ENCRYPTION_KEY"]

[[d1_databases]]
binding = "DB"
database_name = "lets-embed"
database_id = "ee6985fc-ed13-414f-8f85-8727c86f3b48"

[durable_objects]
bindings = [
  { name = "USER_ACCOUNT", class_name = "UserAccount" },
  { name = "AUTH_CHALLENGE", class_name = "AuthChallengeDO" },
  { name = "SITE_POLICY", class_name = "SitePolicyDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthChallengeDO", "SitePolicyDO"]
