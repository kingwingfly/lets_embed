[workspace]

[package]
name = "user_worker_web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lets-embed-ui = { path = "../../lets-embed-ui", features = ["csr"] }
site_access = { path = "../../site_access" }
leptos = { version = "0.8", features = ["csr", "nightly"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
urlencoding = "2"
web-sys = { version = "0.3", features = [
    "BroadcastChannel",
    "Clipboard",
    "Document",
    "Element",
    "Event",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "StorageEvent",
    "UrlSearchParams",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
