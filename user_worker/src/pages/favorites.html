<div class="card">
<div class="headrow"><h1>Favorites</h1></div>
<p class="sub">Your liked posts, images and videos. Previews may cost points.</p>
<ul class="likes" id="likes-list"></ul>
<div class="empty" id="likes-empty" hidden>No favorites yet.</div>
<div class="msg err" id="likes-msg" hidden></div>
<div class="actions" style="margin-top:14px">
<button class="btn small" type="button" id="more-btn" hidden>Load more</button>
</div>
<div class="links"><a href="/user/account">&larr; Account</a><a href="/">Back to site</a></div>
</div>

<script>
"use strict";
var cursor = null;
var loadedAny = false;
var list = document.getElementById("likes-list");
var moreBtn = document.getElementById("more-btn");

function badgeFor(kind) {
  var span = document.createElement("span");
  span.className = "badge " + (kind === "video" ? "warn" : "ok");
  span.textContent = kind;
  return span;
}

function labelFor(kind, id) {
  return (kind === "post" ? "post #" : kind === "image" ? "image #" : "video #") + id;
}

// A /details link that also asks the details page to show images similar to
// this one: mode=similar drives the embedded <Results/> component (see
// search/app/src/components/results.rs), q is the image id it searches by.
function detailsHref(imageId) {
  var id = encodeURIComponent(imageId);
  return "/details/" + id + "?mode=similar&q=" + id + "&limit=50";
}

// Fetch cover/image thumbnails for the post & image likes just loaded.
// Returns a map keyed by "<kind>:<target_id>". Best-effort: on any failure
// the map is empty and items fall back to plain text labels.
async function fetchPreviews(items) {
  var map = {};
  var pairs = [];
  for (var i = 0; i < items.length; i++) {
    var k = items[i].kind;
    if (k === "post" || k === "image") pairs.push(k + ":" + items[i].target_id);
  }
  if (pairs.length === 0) return map;
  try {
    var r = await fetch("/api/like_previews?items=" + encodeURIComponent(pairs.join(",")));
    if (!r.ok) return map;
    var arr = await r.json();
    for (var j = 0; j < arr.length; j++) map[arr[j].kind + ":" + arr[j].target_id] = arr[j];
  } catch (_) {}
  return map;
}

function renderItem(it, preview) {
  var li = document.createElement("li");
  li.appendChild(badgeFor(it.kind));

  if (preview) {
    var img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.alt = labelFor(it.kind, it.target_id);
    img.src = "/images/" + encodeURIComponent(preview.name) + ".webp";
    li.appendChild(img);
  }

  if (it.kind === "image") {
    // image likes always link to their own /details page.
    var imgId = preview ? preview.image_id : it.target_id;
    var a = document.createElement("a");
    a.href = detailsHref(imgId);
    a.textContent = labelFor("image", it.target_id);
    li.appendChild(a);
  } else if (it.kind === "post" && preview) {
    // post likes link to their cover image's /details page.
    var pa = document.createElement("a");
    pa.href = detailsHref(preview.image_id);
    pa.textContent = labelFor("post", it.target_id);
    li.appendChild(pa);
  } else {
    // video, or a post/image whose preview could not be resolved.
    var span = document.createElement("span");
    span.textContent = labelFor(it.kind, it.target_id);
    li.appendChild(span);
  }

  var date = document.createElement("span");
  date.className = "date";
  date.textContent = new Date(it.created_at * 1000).toLocaleString();
  li.appendChild(date);

  var del = document.createElement("button");
  del.type = "button";
  del.className = "btn small ghost";
  del.textContent = "Remove";
  del.addEventListener("click", function () { removeLike(it, li, del); });
  li.appendChild(del);

  list.appendChild(li);
}

// DELETE the like, then drop its <li>. On 401 bounce to login; on any other
// failure re-enable the button and surface the message in #likes-msg.
async function removeLike(it, li, btn) {
  btn.disabled = true;
  try {
    var r = await fetch("/user/api/like", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: it.kind, target_id: it.target_id }),
    });
    if (r.status === 401) {
      location = "/user/login?next=/user/favorites";
      return;
    }
    if (!r.ok) {
      var err;
      try { err = (await r.json()).error; } catch (_) {}
      var msgEl = document.getElementById("likes-msg");
      msgEl.hidden = false;
      msgEl.textContent = err || "failed to remove favorite (" + r.status + ")";
      btn.disabled = false;
      return;
    }
    list.removeChild(li);
    if (list.children.length === 0) {
      loadedAny = false;
      document.getElementById("likes-empty").hidden = false;
      moreBtn.hidden = true;
    }
  } catch (e) {
    var m = document.getElementById("likes-msg");
    m.hidden = false;
    m.textContent = e && e.message ? e.message : String(e);
    btn.disabled = false;
  }
}

async function loadPage() {
  moreBtn.disabled = true;
  try {
    var url = "/user/api/likes?limit=50";
    if (cursor !== null) url += "&cursor=" + encodeURIComponent(cursor);
    var r = await fetch(url);
    if (r.status === 401) {
      location = "/user/login?next=/user/favorites";
      return;
    }
    if (!r.ok) {
      var err;
      try { err = (await r.json()).error; } catch (_) {}
      var msgEl = document.getElementById("likes-msg");
      msgEl.hidden = false;
      msgEl.textContent = err || "failed to load favorites (" + r.status + ")";
      return;
    }
    var data = await r.json();
    var previews = await fetchPreviews(data.items);
    for (var i = 0; i < data.items.length; i++) {
      var it = data.items[i];
      renderItem(it, previews[it.kind + ":" + it.target_id]);
    }
    loadedAny = loadedAny || data.items.length > 0;
    document.getElementById("likes-empty").hidden = loadedAny;
    cursor = data.next_cursor;
    moreBtn.hidden = cursor === null || cursor === undefined;
  } catch (e) {
    var m = document.getElementById("likes-msg");
    m.hidden = false;
    m.textContent = e && e.message ? e.message : String(e);
  } finally {
    moreBtn.disabled = false;
  }
}

moreBtn.addEventListener("click", loadPage);
loadPage();
</script>
