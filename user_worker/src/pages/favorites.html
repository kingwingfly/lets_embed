<section id="fav-gallery" aria-label="Favorites gallery">
  <header class="fav-header">
    <div class="fav-title-group">
      <h1>Favorites</h1>
      <div class="fav-tabs" role="tablist" aria-label="Favorite categories">
        <button class="fav-tab" type="button" role="tab" id="tab-image" data-kind="image" aria-selected="true" aria-controls="fav-panel">
          <span class="tab-icon" aria-hidden="true">♥</span>
          <span>Single images</span>
          <span class="fav-count" id="count-image" hidden></span>
        </button>
        <button class="fav-tab" type="button" role="tab" id="tab-post" data-kind="post" aria-selected="false" aria-controls="fav-panel">
          <span class="tab-icon" aria-hidden="true">★</span>
          <span>Posts</span>
          <span class="fav-count" id="count-post" hidden></span>
        </button>
        <button class="fav-tab" type="button" role="tab" id="tab-video" data-kind="video" aria-selected="false" aria-controls="fav-panel" hidden>
          <span class="tab-icon" aria-hidden="true">▶</span>
          <span>Videos</span>
          <span class="fav-count" id="count-video" hidden></span>
        </button>
      </div>
    </div>
    <div class="fav-controls">
      <p class="fav-note">Click an image to inspect · Opening previews may use points</p>
      <div class="density-group" role="group" aria-label="Grid size">
        <button class="density-btn" type="button" data-size="compact" aria-pressed="false">Compact</button>
        <button class="density-btn" type="button" data-size="medium" aria-pressed="true">Medium</button>
        <button class="density-btn" type="button" data-size="large" aria-pressed="false">Large</button>
      </div>
    </div>
  </header>

  <div class="msg err" id="likes-msg" role="status" hidden></div>

  <div id="fav-panel" role="tabpanel" aria-labelledby="tab-image">
    <div class="fav-masonry" id="fav-grid"></div>
    <div class="fav-empty" id="likes-empty" hidden>
      <p id="likes-empty-text">No favorites yet.</p>
      <div class="fav-empty-actions">
        <button class="btn small secondary" type="button" id="empty-switch-btn" hidden></button>
        <a class="btn small" href="/">Explore the gallery</a>
      </div>
    </div>
  </div>

  <div class="fav-footer">
    <div class="fav-loading" id="fav-loading" hidden>Loading favorites…</div>
    <button class="btn secondary" type="button" id="more-btn" hidden>Load more</button>
    <div class="fav-end" id="fav-end" hidden>— 🌿 —</div>
  </div>
</section>

<div class="fav-viewer" id="fav-viewer" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <div class="fav-viewer-bar">
    <div class="fav-viewer-info">
      <span class="fav-viewer-title" id="viewer-title"></span>
      <span class="fav-viewer-counter" id="viewer-counter"></span>
    </div>
    <div class="fav-viewer-actions">
      <a class="fav-viewer-btn" id="viewer-details" href="#">Details &amp; similar ↗</a>
      <button class="fav-viewer-btn danger" type="button" id="viewer-unfav">♥ Remove</button>
      <button class="fav-viewer-btn" type="button" id="viewer-close" aria-label="Close viewer">× Close</button>
    </div>
  </div>
  <div class="fav-viewer-stage" id="viewer-stage">
    <button class="fav-nav prev" type="button" id="viewer-prev" aria-label="Previous image">‹</button>
    <img class="fav-viewer-img" id="viewer-img" alt="">
    <button class="fav-nav next" type="button" id="viewer-next" aria-label="Next image">›</button>
  </div>
</div>

<div class="fav-toast" id="fav-toast" role="status" aria-live="polite" hidden>
  <span id="fav-toast-text"></span>
  <button type="button" id="fav-undo-btn">Undo</button>
</div>

<script>__FAVORITES_SCRIPT__</script>
