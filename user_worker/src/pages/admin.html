<div class="page-hero admin-hero">
  <div class="admin-hero-copy">
    <div class="admin-eyebrow">Admin workspace</div>
    <h1>Gallery controls</h1>
    <p class="identity">Signed in as <strong>__EMAIL__</strong></p>
  </div>
  <div class="admin-hero-right">
    <div class="hero-chips">
      <span class="hero-chip"><span class="chip-dot __MODE_DOT__"></span>__MODE_LABEL__</span>
      <span class="hero-chip"><strong>__USER_TOTAL__</strong> accounts</span>
    </div>
    <span class="cloud-friend" aria-hidden="true"><i></i></span>
  </div>
</div>

<div class="admin-shell" data-initial-tab="__INITIAL_TAB__">
  <nav class="admin-tabs" role="tablist" aria-label="Dashboard sections">
    <a id="tab-access" role="tab" href="#access" data-tab="access" aria-controls="access" aria-selected="false">
      <span class="tab-ico" aria-hidden="true">🌐</span><span>Browsing access</span><span class="tab-dirty" aria-hidden="true"></span>
    </a>
    <a id="tab-pricing" role="tab" href="#pricing" data-tab="pricing" aria-controls="pricing" aria-selected="false">
      <span class="tab-ico" aria-hidden="true">🏷️</span><span>Prices &amp; free</span><span class="tab-dirty" aria-hidden="true"></span>
    </a>
    <a id="tab-plans" role="tab" href="#plans" data-tab="plans" aria-controls="plans" aria-selected="false">
      <span class="tab-ico" aria-hidden="true">✨</span><span>Subscriptions</span><span class="tab-dirty" aria-hidden="true"></span>
    </a>
    <a id="tab-payments" role="tab" href="#payments" data-tab="payments" aria-controls="payments" aria-selected="false">
      <span class="tab-ico" aria-hidden="true">💳</span><span>Payments &amp; credits</span><span class="tab-dirty" aria-hidden="true"></span>
    </a>
    <a id="tab-accounts" role="tab" href="#accounts" data-tab="accounts" aria-controls="accounts" aria-selected="false">
      <span class="tab-ico" aria-hidden="true">👥</span><span>Accounts</span><span class="tab-count">__USER_TOTAL__</span>
    </a>
  </nav>

  <div class="admin-stage">__CONTENT__</div>
</div>

<script>
(() => {
  const shell = document.querySelector('.admin-shell');
  const tabs = Array.from(document.querySelectorAll('.admin-tabs [role="tab"]'));
  const panels = Array.from(document.querySelectorAll('.admin-stage .tab-panel'));
  const settingsForm = document.getElementById('settings');
  const saveBar = document.getElementById('settings-save-bar');
  const saveState = document.getElementById('save-state');
  const activeTabInput = document.getElementById('settings-active-tab');
  const SETTINGS_TABS = new Set(['access', 'pricing', 'plans', 'payments']);
  const VALID_TABS = new Set(['access', 'pricing', 'plans', 'payments', 'accounts']);

  let dirty = false;

  function activateTab(name, updateHash) {
    const target = VALID_TABS.has(name) ? name : 'access';
    tabs.forEach((tab) => {
      const on = tab.dataset.tab === target;
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
      tab.classList.toggle('is-active', on);
    });
    panels.forEach((panel) => {
      const on = panel.dataset.tab === target;
      panel.classList.toggle('is-active', on);
      panel.setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    if (saveBar) {
      saveBar.classList.toggle('is-hidden', !SETTINGS_TABS.has(target));
    }
    if (activeTabInput && SETTINGS_TABS.has(target)) {
      activeTabInput.value = target;
    }
    if (updateHash && window.location.hash !== '#' + target) {
      history.replaceState(null, '', window.location.pathname + window.location.search + '#' + target);
    }
  }

  tabs.forEach((tab, idx) => {
    tab.addEventListener('click', (ev) => {
      ev.preventDefault();
      activateTab(tab.dataset.tab, true);
    });
    tab.addEventListener('keydown', (ev) => {
      let next = null;
      if (ev.key === 'ArrowRight') next = (idx + 1) % tabs.length;
      else if (ev.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
      else if (ev.key === 'Home') next = 0;
      else if (ev.key === 'End') next = tabs.length - 1;
      if (next !== null) {
        ev.preventDefault();
        tabs[next].focus();
        activateTab(tabs[next].dataset.tab, true);
      }
    });
  });

  window.addEventListener('hashchange', () => {
    const h = window.location.hash.replace(/^#/, '');
    if (VALID_TABS.has(h)) activateTab(h, false);
  });

  if (settingsForm) {
    settingsForm.addEventListener('input', () => {
      dirty = true;
      if (saveState) saveState.textContent = 'Unsaved changes';
      if (saveBar) saveBar.classList.add('is-dirty');
      if (shell) shell.classList.add('has-unsaved');
    });
    settingsForm.addEventListener('invalid', (ev) => {
      const panel = ev.target && ev.target.closest ? ev.target.closest('.tab-panel') : null;
      if (panel && panel.dataset.tab) {
        activateTab(panel.dataset.tab, true);
      }
    }, true);
  }

  // Initial tab: prefer server-chosen tab when account query params are active, otherwise URL hash.
  const serverTab = shell ? shell.dataset.initialTab : 'access';
  const hashTab = window.location.hash.replace(/^#/, '');
  const params = new URLSearchParams(window.location.search);
  const hasAccountQuery = ['address', 'q', 'plan', 'status', 'wallet', 'sort', 'page', 'ok'].some((k) => params.has(k));
  const startTab = hasAccountQuery
    ? 'accounts'
    : (VALID_TABS.has(hashTab) ? hashTab : serverTab);
  activateTab(startTab, false);

  // Quick-fill preset chips (credits & subscription days).
  document.addEventListener('click', (ev) => {
    const preset = ev.target.closest('[data-fill-target]');
    if (preset) {
      const input = document.getElementById(preset.dataset.fillTarget);
      if (input) {
        input.value = preset.dataset.fillValue;
        input.focus();
      }
      return;
    }
    const copyBtn = ev.target.closest('[data-copy]');
    if (copyBtn) {
      const text = copyBtn.dataset.copy;
      if (navigator.clipboard && text) {
        navigator.clipboard.writeText(text).then(() => {
          const prev = copyBtn.textContent;
          copyBtn.textContent = '✓';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = prev;
            copyBtn.classList.remove('copied');
          }, 1200);
        }).catch(() => {});
      }
      return;
    }
    const closeBtn = ev.target.closest('.banner-close');
    if (closeBtn) {
      const banner = closeBtn.closest('.admin-banner');
      if (banner) banner.remove();
    }
  });

  // Toggle days field UX when selecting "Revoke plan".
  const planSelect = document.getElementById('admin-plan-select');
  const daysWrap = document.getElementById('admin-plan-days-wrap');
  const daysInput = document.getElementById('admin-plan-days');
  function syncPlanDays() {
    if (!planSelect || !daysWrap || !daysInput) return;
    const revoking = planSelect.value === 'none';
    daysWrap.classList.toggle('is-muted', revoking);
    daysInput.required = !revoking;
  }
  if (planSelect) {
    planSelect.addEventListener('change', syncPlanDays);
    syncPlanDays();
  }
})();
</script>
