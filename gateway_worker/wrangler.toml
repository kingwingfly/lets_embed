name = "gateway-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

# Worker secrets; deploy fails until each is set with `wrangler secret put <NAME>`:
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — Access service token for the upstreams
#   JWT_SECRET — must equal user-worker's JWT_SECRET. Generate it once with
#     `openssl rand -base64 48` and put the same value into both workers.
[secrets]
required = ["CF_ACCESS_CLIENT_ID", "CF_ACCESS_CLIENT_SECRET", "JWT_SECRET"]

[[services]]
binding = "USER_WORKER"
service = "user-worker"

# Only the gateway's verified admin path selects this binding.
[[services]]
binding = "ADMIN_WORKER"
service = "user-worker"
props = { gallery_admin = true }

[vars]
# Audience of the Access application protecting /user/admin and its descendants.
CF_ACCESS_AUD = "5700459f509f888154922a3f93bbf18d7dbd6b4be7fa472716693eb2fefb6ba5"

[durable_objects]
bindings = [{ name = "USER_ACCOUNT", class_name = "UserAccount", script_name = "user-worker" }]
