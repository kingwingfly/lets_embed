name = "lets-embed-gateway-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"
# Public *.workers.dev and preview URLs stay disabled; bind your gallery hostname
# via a Custom Domain or Zone Route in Cloudflare Dashboard (or `routes = [...]`).
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

# Worker secrets; deploy fails until each required secret is set with `wrangler secret put <NAME>`:
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — Access service token for the private upstreams
#   JWT_SECRET — shared with lets-embed-user-worker for legacy wallet sessions, guest IP hashing,
#     and admin browse passes. Generate with `openssl rand -base64 48`.
#   SESSION_V2_SECRET — (recommended; optional during cutover) dedicated secret for revocable `v2.`
#     session cookies. When unset or empty during cutover, gateway_worker verifies `v2.` tokens
#     against JWT_SECRET using site_access's built-in `"session/v2\0"` HMAC domain separation.
#   GATEWAY_ASSERTION_SECRET — dedicated secret shared ONLY with lets-embed-web to sign short-lived
#     X-Gateway-Assertion headers (30s TTL, audience "lets-embed-web").
#   MEDIA_CAP_SECRET — dedicated secret shared ONLY with lets-embed-web to verify per-object
#     `/media/{image,video,preview}/{id}?cap=...` capability tokens.
#
# SECURITY: gateway_worker MUST NEVER hold SETTINGS_ENCRYPTION_KEY (provider secrets stay strictly
# isolated to lets-embed-user-worker and lets-embed-admin-dashboard-worker).
[secrets]
required = [
  "CF_ACCESS_CLIENT_ID",
  "CF_ACCESS_CLIENT_SECRET",
  "JWT_SECRET",
  "GATEWAY_ASSERTION_SECRET",
  "MEDIA_CAP_SECRET",
]

[[services]]
binding = "USER_WORKER"
service = "lets-embed-user-worker"

# Only the gateway's Cloudflare Access-verified `/admin` path selects this binding.
[[services]]
binding = "ADMIN_DASHBOARD_WORKER"
service = "lets-embed-admin-dashboard-worker"
props = { gallery_admin = true }

[vars]
# Audience of the Cloudflare Access application protecting `/admin` and its descendants.
CF_ACCESS_AUD = "5700459f509f888154922a3f93bbf18d7dbd6b4be7fa472716693eb2fefb6ba5"
# Upstream origins proxied by the gateway (trailing slashes are trimmed at runtime).
API_UPSTREAM = "https://lets-embed-web.louisfly.icu"
IMAGE_UPSTREAM = "https://lets-embed-image.louisfly.icu"
VIDEO_UPSTREAM = "https://lets-embed-video.louisfly.icu"

[durable_objects]
bindings = [
  { name = "USER_ACCOUNT", class_name = "UserAccount", script_name = "lets-embed-user-worker" },
  { name = "SITE_POLICY", class_name = "SitePolicyDO", script_name = "lets-embed-user-worker" },
]
