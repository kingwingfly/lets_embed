name = "gateway-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

# Worker secrets (not declared here), set once per secret:
#   wrangler secret put CF_ACCESS_CLIENT_ID      # Access service token for the upstreams
#   wrangler secret put CF_ACCESS_CLIENT_SECRET
#   wrangler secret put JWT_SECRET               # must equal user-worker's JWT_SECRET

[[services]]
binding = "USER_WORKER"
service = "user-worker"

[durable_objects]
bindings = [{ name = "USER_ACCOUNT", class_name = "UserAccount", script_name = "user-worker" }]
