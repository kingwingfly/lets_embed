name = "gateway-worker"
main = "build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --profile wasm-release"

[observability.logs]
enabled = true
invocation_logs = true

# Worker secrets; deploy fails until each is set with `wrangler secret put <NAME>`:
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — Access service token for the upstreams
#   JWT_SECRET — must equal user-worker's JWT_SECRET
[secrets]
required = ["CF_ACCESS_CLIENT_ID", "CF_ACCESS_CLIENT_SECRET", "JWT_SECRET"]

[[services]]
binding = "USER_WORKER"
service = "user-worker"

[durable_objects]
bindings = [{ name = "USER_ACCOUNT", class_name = "UserAccount", script_name = "user-worker" }]
