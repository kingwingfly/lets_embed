[package]
name = "gateway_worker"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[lib]
# rlib in addition to cdylib so `cargo test -p gateway_worker` runs host unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
site_access = { path = "../site_access" }
worker = { version = "0.9", features = ["http", "axum"] }
futures = { workspace = true, default-features = false }
axum = { workspace = true, features = ["macros", "form", "json"] }
tower-service = "0.3"
tower-cookies = "0.11"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
