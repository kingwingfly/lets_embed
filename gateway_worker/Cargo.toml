[package]
name = "gateway_worker"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
site_access = { path = "../site_access" }
worker = { version = "0.9", features = ["http", "axum"] }
axum = { workspace = true, features = ["macros", "form", "json"] }
tower-service = "0.3"
tower-cookies = "0.11"
serde.workspace = true
serde_json.workspace = true
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
bs58 = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
