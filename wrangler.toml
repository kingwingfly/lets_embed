name = "gateway-worker"
main = "gateway_worker/build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --profile wasm-release gateway_worker"

[observability.logs]
enabled = true
invocation_logs = true

[[secrets_store_secrets]]
binding = "lets-embed-client-id"
store_id = "93d561f5fef7447eb3e1fd77e6445903"
secret_name = "lets-embed-client-id"

[[secrets_store_secrets]]
binding = "lets-embed-client-secret"
store_id = "93d561f5fef7447eb3e1fd77e6445903"
secret_name = "lets-embed-client-secret"
