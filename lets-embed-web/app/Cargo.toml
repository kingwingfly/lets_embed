[package]
name = "app"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["nightly"] }
leptos_meta = { version = "0.8", features = [] }
leptos_router = { version = "0.8", features = ["nightly"] }
leptos-use-element-size = "0.20"
leptos-use-event-listener = "0.20"
leptos-use-intersection-observer = "0.20"
leptos-use-signal-debounce-throttle = "0.20"
leptos-use-window = "0.20"
leptos-use-window-scroll = "0.20"

search_types = { path = "../../search_types", features = ["serde"] }
site_access = { path = "../../site_access" }
lets-embed-ui = { path = "../../lets-embed-ui", default-features = false }

serde.workspace = true
serde_json = "1"
urlencoding = "2"

wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "EventSource", "MessageEvent", "Element",
    "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
    "ScrollToOptions", "ScrollBehavior", "Window", "DomRect", "CanvasRenderingContext2d",
    "ImageBitmap", "FileList", "File", "Touch", "TouchEvent", "TouchList",
    "Request", "RequestInit", "Response", "Headers", "Storage",
    "History", "PopStateEvent", "NodeList", "BroadcastChannel", "ScrollRestoration"
] }

tokio = { workspace = true, optional = true }
search_engine = { path = "../../search_engine", optional = true, features = ["serde"] }
axum = { workspace = true, optional = true, features = ["macros"] }
leptos_axum = { version = "0.8", optional = true }
futures = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
arc-swap = { version = "1.9", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
pulldown-cmark = { version = "0.13", optional = true }
ammonia = { version = "4", optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "lets-embed-ui/hydrate", "dep:wasm-bindgen-futures"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "lets-embed-ui/ssr",
    "leptos-use-element-size/ssr",
    "leptos-use-event-listener/ssr",
    "leptos-use-intersection-observer/ssr",
    "leptos-use-signal-debounce-throttle/ssr",
    "leptos-use-window/ssr",
    "leptos-use-window-scroll/ssr",
    "dep:tokio",
    "dep:search_engine",
    "dep:axum",
    "dep:leptos_axum",
    "dep:futures",
    "dep:base64",
    "dep:anyhow",
    "dep:tracing",
    "dep:url",
    "dep:arc-swap",
    "dep:reqwest",
    "dep:pulldown-cmark",
    "dep:ammonia",
]
