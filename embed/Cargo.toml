[package]
name = "embed"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
wd_tagger = { path = "../wd_tagger" }
siglip2 = { path = "../siglip2" }
dinov3 = { path = "../dinov3" }

tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
anyhow.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = [] }
opentelemetry-appender-tracing = "0.33"
clap.workspace = true

opendal = { version = "0.59", features = ["services-fs", "services-http", "services-s3"] }
sqlx.workspace = true
pgvector.workspace = true

dotenvy.workspace = true
ort.workspace = true
url.workspace = true
sysinfo = "0.40"
nvml-wrapper = "0.13"
parking_lot.workspace = true
starve-not = { version = "0.1.0-alpha.5", features = ["diagnostics"] }
